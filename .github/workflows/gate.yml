name: gate
# fallfloor enterprise proves itself on every push, on GitHub's runner: the tests hold, the mutation gate is CLEAN on
# the design's kernel, the live page IS that kernel over the committed inputs (fixpoint), the page passes its own gate,
# and the measured evidence still re-derives from fallfloor's pinned, signed ledger. No green is faked here.
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: the tests hold (kernel, dual-map, hash)
        run: node --test

      - name: the mutation gate is CLEAN (kernel.mjs is not test-theatre)
        run: |
          node tools/witness.mjs mutate kernel.mjs --timeout 60000 --cap 900 --test node --test kernel.test.mjs | tee gate.out || true
          node -e "const b=require('fs').readFileSync('gate.out','utf8');const j=JSON.parse(b.slice(b.indexOf('{'),b.lastIndexOf('}')+1));if(j.clean!==true){console.error('GATE NOT CLEAN');process.exit(1)}console.log('CLEAN '+j.killed+'/'+j.total)"

      - name: the live page IS the gated kernel over the committed inputs (fixpoint)
        run: |
          node tools/make-page.mjs
          git diff --exit-code index.html README.md llms.txt

      - name: the page passes its own gate (controls, links, CSS variables, scripts, sources, credits, AI-GEO)
        run: node tools/page-gate.mjs

      - name: the evidence re-derives from fallfloor's pinned, signed ledger
        run: node tools/evidence-from-fallfloor.mjs
